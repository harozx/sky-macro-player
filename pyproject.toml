[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "sky-macro-player"
version = "3.0.0"
description = "Desktop music-sheet player for Sky and Heartopia"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.11.2",
    "pynput==1.8.1",
]

[project.scripts]
sky-macro-player = "macro_player.app:main"

[project.gui-scripts]
sky-macro-player-gui = "macro_player.app:main"

[tool.setuptools]
py-modules = ["gui_qt", "macro_core"]

[tool.setuptools.packages.find]
include = ["macro_player*"]

[tool.setuptools.data-files]
"share/sky-macro-player/sheets" = ["sheets/*.json", "sheets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra --basetemp=.test-tmp"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", "legacy", ".test-tmp"]

[tool.ruff.lint]
select = ["F", "E", "I", "B"]

[tool.mypy]
python_version = "3.10"
files = ["macro_player"]

[[tool.mypy.overrides]]
module = ["pynput", "pynput.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Qt stylesheet rules read best one per line.
"macro_player/ui/theme.py" = ["E501"]
