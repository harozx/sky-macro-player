name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate project configuration
        shell: pwsh
        run: |
          python -c "import pathlib, sys; name = 'tomllib' if sys.version_info >= (3, 11) else 'pip._vendor.tomli'; tomllib = __import__(name, fromlist=['loads']); tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); print('pyproject.toml: OK')"

      - name: Compile Python sources
        run: python -m compileall -q macro_core.py gui_qt.py macro_player tests

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy macro_player

      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report --fail-under=85

      - name: Build and inspect wheel artifact
        if: matrix.python-version == '3.11'
        shell: pwsh
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          python -c "import sys, zipfile; z=zipfile.ZipFile(sys.argv[1]); names=z.namelist(); sheets=[n for n in names if '/sky-macro-player/sheets/' in n]; assert len(sheets)==118, len(sheets); assert any(n.endswith('entry_points.txt') for n in names); print('artifact sheets:', len(sheets))" $wheel.FullName

  package:
    name: Windows app and installer
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install --requirement requirements-build.txt

      - name: Build one-folder app and portable zip
        run: python packaging/build_exe.py --zip

      - name: Smoke test the packaged app
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          SKY_MACRO_DATA_DIR: ${{ runner.temp }}\smoke-data
        run: |
          $process = Start-Process dist\SkyMacroPlayer\SkyMacroPlayer.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "smoke test failed: $($process.ExitCode)" }
          $count = (Get-ChildItem "$env:SKY_MACRO_DATA_DIR\sheets" -Filter *.* -File | Where-Object { $_.Extension -in ".txt", ".json" }).Count
          if ($count -ne 118) { throw "expected 118 seeded sheets, found $count" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          $version = python -c "import macro_player; print(macro_player.__version__)"
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyMacroPlayer-windows
          path: |
            dist/*.zip
            dist/*Setup*.exe

      - name: Publish release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*Setup*.exe
